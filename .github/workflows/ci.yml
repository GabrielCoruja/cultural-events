name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Back-end (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: culturalevents-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build e testes
        run: ./mvnw -B verify

  frontend:
    name: Front-end (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: culturalevents-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: culturalevents-frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Testes
        run: npx ng test --watch=false --browsers=ChromeHeadless
